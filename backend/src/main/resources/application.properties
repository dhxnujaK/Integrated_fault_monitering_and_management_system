spring.application.name=backend
server.port=8080

# ---- Datasource (normal runtime) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fault_monitor_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# ---- JWT ----
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ---- ML service ----
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=${ML_SERVICE_TIMEOUT_MS:3000}
ml.service.retry-count=${ML_SERVICE_RETRY_COUNT:1}
ml.prediction.enabled=${ML_PREDICTION_ENABLED:false}
ml.prediction.initial-delay-ms=${ML_PREDICTION_INITIAL_DELAY_MS:15000}
ml.prediction.fixed-delay-ms=${ML_PREDICTION_FIXED_DELAY_MS:60000}

# ---- Mock sensor simulator ----
simulation.enabled=${SIMULATION_ENABLED:false}
simulation.fault-injection.enabled=${SIMULATION_FAULT_INJECTION_ENABLED:false}
