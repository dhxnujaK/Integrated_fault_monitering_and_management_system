spring.application.name=backend
server.port=8080

# ---- Datasource (H2 In-Memory) ----
spring.datasource.url=jdbc:h2:mem:fault_monitor_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ---- JWT ----
# 256-bit (32+ byte) Base64-friendly secret. Override per environment.
jwt.secret=ZmF1bHRtb25pdG9yLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLTI1Ni1iaXQ=
jwt.expiration=86400000

# ---- ML service ----
ml.service.url=http://localhost:8000

# ---- Mock sensor simulator ----
simulation.enabled=true
