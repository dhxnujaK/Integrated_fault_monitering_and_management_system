spring.application.name=backend
server.port=8080

# ---- Datasource (MySQL) ----
# createDatabaseIfNotExist=true lets the backend bootstrap before Dhanuja's manual DB setup.
spring.datasource.url=jdbc:mysql://localhost:3306/fault_monitor_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# 256-bit (32+ byte) Base64-friendly secret. Override per environment.
jwt.secret=ZmF1bHRtb25pdG9yLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLTI1Ni1iaXQ=
jwt.expiration=86400000

# ---- ML service ----
ml.service.url=http://localhost:8000

# ---- Mock sensor simulator ----
simulation.enabled=true
