# Local-only development profile. Start with --spring.profiles.active=dev.
spring.datasource.url=jdbc:h2:mem:fault_monitor_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
jwt.secret=ZmF1bHRtb25pdG9yLWxvY2FsLWRldi1zZWNyZXQta2V5LTI1Ni1iaXQ=
simulation.enabled=true
simulation.fault-injection.enabled=true
# The dev simulator emits one reading per tick (every 5 s), each standing for a 5-minute
# sample, so every reading gets its own prediction.
ml.prediction.initial-delay-ms=${ML_PREDICTION_INITIAL_DELAY_MS:10000}
ml.prediction.fixed-delay-ms=${ML_PREDICTION_FIXED_DELAY_MS:5000}
